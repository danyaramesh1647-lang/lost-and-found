<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost & Found - Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="auth-container">
    <h1>🔎 Lost & Found</h1>
<h1>Lost &amp; Found</h1>
<p class="tagline">Campus noticeboard — post it, someone's probably looking</p>
    <div class="tabs">
      <button id="loginTab" class="tab-btn active">Login</button>
      <button id="registerTab" class="tab-btn">Register</button>
    </div>

    <form id="loginForm" class="auth-form">
      <input type="email" id="loginEmail" placeholder="Email" required />
      <input type="password" id="loginPassword" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>

    <form id="registerForm" class="auth-form hidden">
      <input type="email" id="registerEmail" placeholder="Email" required />
      <input type="password" id="registerPassword" placeholder="Password (min 6 chars)" required />
      <button type="submit">Create Account</button>
    </form>

    <p id="authMessage" class="message"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
</body>
</html>
